<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课时计划 · 结课与续费提醒</title>
  <style>
    :root {
      --color-primary: #2563eb;
      --color-on-primary: #ffffff;
      --color-secondary: #b45309;
      --color-background: #eff6ff;
      --color-foreground: #0f172a;
      --color-card: #ffffff;
      --color-muted: #f1f5fd;
      --color-muted-foreground: #475569;
      --color-border: #dbe7fb;
      --color-ring: #2563eb;
      --color-renew-bg: #fffbeb;
      --color-renew-border: #f6d48a;
      --color-end-bg: #ecfdf5;
      --color-end-border: #a7f3d0;
      --color-end-text: #065f46;
      --shadow: 0 10px 28px rgba(37, 99, 235, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
      --radius: 20px;
      --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      color: var(--color-foreground);
      background:
        radial-gradient(900px 420px at 10% -10%, #dbeafe 0%, transparent 60%),
        radial-gradient(700px 380px at 110% 0%, #fde68a 0%, transparent 46%),
        var(--color-background);
    }

    .wrap {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    header {
      display: grid;
      gap: 8px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 8px 0 0;
      max-width: 40em;
      color: var(--color-muted-foreground);
    }

    .header-actions {
      width: 220px;
      flex: none;
      margin-bottom: 2px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      gap: 20px;
      margin-top: 28px;
      align-items: start;
    }

    .card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    form {
      padding: 22px;
      display: grid;
      gap: 18px;
    }

    .field { display: grid; gap: 8px; }

    .field > span,
    legend {
      font-size: 14px;
      font-weight: 600;
    }

    legend { padding: 0; }

    fieldset {
      margin: 0;
      padding: 0;
      border: 0;
      display: grid;
      gap: 8px;
    }

    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    input[type="date"],
    input[type="text"],
    select {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid #c9d8f5;
      border-radius: 14px;
      background: var(--color-muted);
      color: var(--color-foreground);
      font: inherit;
    }

    input:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--color-ring);
      outline-offset: 2px;
    }

    .segment {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .segment button,
    .stepper button,
    .days button,
    .actions button {
      cursor: pointer;
      font: inherit;
      border-radius: 14px;
      transition: background-color 180ms ease, color 180ms ease, transform 180ms ease, border-color 180ms ease;
    }

    .segment button {
      min-height: 48px;
      border: 1px solid #c9d8f5;
      background: var(--color-muted);
      color: var(--color-foreground);
      font-weight: 600;
    }

    .segment button[aria-pressed="true"] {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-on-primary);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .actions button {
      min-height: 48px;
      font-weight: 650;
    }

    .actions .primary {
      border: 1px solid var(--color-primary);
      background: var(--color-primary);
      color: var(--color-on-primary);
    }

    .actions .ghost {
      border: 1px solid #c9d8f5;
      background: #fff;
      color: var(--color-foreground);
    }

    .actions button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      margin: 0;
      min-height: 1.4em;
      font-size: 13px;
      color: #065f46;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.45);
    }

    .modal[hidden] { display: none; }

    .modal-card {
      width: min(440px, 100%);
      max-height: calc(100vh - 48px);
      overflow: auto;
      padding: 24px;
      background: var(--color-card);
      border-radius: var(--radius);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.2);
    }

    .modal-card h2 {
      margin: 0 0 18px;
      font-size: 22px;
    }

    .modal-card form {
      padding: 0;
      box-shadow: none;
    }

    .segment button:active,
    .days button:active,
    .stepper button:active,
    .actions button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .days button {
      min-height: 48px;
      padding: 0;
      border: 1px solid #c9d8f5;
      background: #fff;
      color: var(--color-foreground);
      font-weight: 650;
    }

    .days button[aria-pressed="true"] {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1e3a8a;
    }

    .stepper {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      gap: 8px;
      align-items: center;
    }

    .stepper button {
      height: 48px;
      border: 1px solid #c9d8f5;
      background: #fff;
      color: var(--color-foreground);
      font-size: 22px;
      line-height: 1;
    }

    .stepper strong {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
    }

    .hint {
      margin: 0;
      color: var(--color-muted-foreground);
      font-size: 13px;
    }

    .error {
      margin: 0;
      color: #991b1b;
      background: #fef2f2;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
    }

    .result { padding: 26px 26px 18px; }

    .who {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .start-line {
      margin: 4px 0 12px;
      color: var(--color-muted-foreground);
      font-size: 14px;
    }

    .eyebrow {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-primary);
    }

    .date-main {
      margin: 6px 0 0;
      font-size: clamp(40px, 6vw, 64px);
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .date-sub {
      margin: 8px 0 0;
      font-size: 18px;
      color: var(--color-muted-foreground);
    }

    .renew {
      margin-top: 20px;
      padding: 16px 16px 14px;
      border-radius: 16px;
      background: var(--color-renew-bg);
      border: 1px solid var(--color-renew-border);
    }

    .renew h2,
    .list-head h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .renew p {
      margin: 6px 0 0;
      font-size: 20px;
      font-weight: 700;
    }

    .renew .detail {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 400;
      color: #78350f;
    }

    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin: 22px 0 10px;
    }

    .list-head p {
      margin: 0;
      color: var(--color-muted-foreground);
      font-size: 13px;
    }

    ol {
      list-style: none;
      margin: 0;
      padding: 0 0 8px;
      max-height: 420px;
      overflow: auto;
    }

    li {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 52px;
      padding: 8px 4px;
      border-top: 1px solid #eef3fb;
    }

    li .idx {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--color-muted);
      font-weight: 700;
      font-size: 14px;
    }

    li .when { font-weight: 600; }
    li .meta { color: var(--color-muted-foreground); font-size: 13px; }
    li .tag {
      font-size: 13px;
      font-weight: 650;
      color: var(--color-muted-foreground);
    }

    li.is-renew .idx { background: #fef3c7; color: #92400e; }
    li.is-renew .tag { color: var(--color-secondary); }
    li.is-end .idx { background: var(--color-end-bg); color: var(--color-end-text); }
    li.is-end .tag { color: var(--color-end-text); }

    @media (max-width: 800px) {
      header { display: block; }
      .header-top { flex-direction: column; align-items: stretch; }
      .header-actions { width: 100%; }
      .layout { grid-template-columns: 1fr; }
      header h1 { font-size: 28px; }
      .wrap { width: min(1080px, calc(100% - 24px)); padding-top: 20px; }
      .days { grid-template-columns: repeat(4, 1fr); }
      .pair { grid-template-columns: 1fr; }
      form, .result { padding: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .segment button,
      .stepper button,
      .days button,
      .actions button { transition: none; }
    }

    /* Refined workspace layout */
    :root { --color-background:#f5f7fb; --color-border:#e3e8f0; --color-muted:#f6f8fc; --color-muted-foreground:#596579; --radius:18px; --shadow:0 4px 24px rgba(25,44,78,.035); }
    body { background:var(--color-background); }
    .wrap { width:min(1160px,calc(100% - 64px)); padding:38px 0 24px; }
    .brand { color:#2563eb; font-size:12px; font-weight:750; letter-spacing:.14em; margin-bottom:14px; }
    header h1 { font-size:30px; letter-spacing:-.04em; }
    header p { font-size:14px; max-width:none; margin-top:10px; }
    .header-actions { width:228px; }
    .header-actions .ghost { color:#9f3030; }
    .layout { grid-template-columns:350px minmax(0,1fr); gap:24px; margin-top:28px; }
    .panel-title { margin:0; font-size:17px; font-weight:700; }
    .panel-title small { display:block; font-size:12px; font-weight:400; color:var(--color-muted-foreground); margin-top:4px; }
    form { padding:24px; gap:22px; }
    .field > span, legend { font-size:13px; }
    input[type="date"], input[type="text"], select { background:#fff; border-color:#dce2ec; border-radius:10px; font-size:14px; min-width:0; }
    input:hover, select:hover { border-color:#9cabc2; }
    .hint { font-size:12px; line-height:1.65; }
    .status:empty { display:none; }
    .status { padding:9px 12px; border-radius:8px; background:#eef8f2; }
    .days { gap:5px; }
    .days button { min-height:44px; border-radius:9px; border-color:#dce2ec; font-size:13px; }
    .days button[aria-pressed="true"] { background:#2563eb; border-color:#2563eb; color:#fff; box-shadow:0 2px 5px #2563eb22; }
    .days button:hover { border-color:#2563eb; }
    .day-slot { display:grid; gap:6px; align-content:start; }
    .day-slot select { min-height:32px; padding:0 2px; font-size:12px; text-align:center; }
    .day-slot select[hidden] { display:none; }
    .stepper { grid-template-columns:44px 1fr 44px; padding:6px; background:var(--color-muted); border:1px solid var(--color-border); border-radius:12px; }
    .stepper button { height:44px; border-radius:8px; border-color:var(--color-border); }
    .stepper strong, .stepper input { font-size:28px; font-variant-numeric:tabular-nums; }
    .stepper input {
      width: 100%;
      height: 44px;
      margin: 0;
      padding: 0 4px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--color-foreground);
      font-weight: 700;
      text-align: center;
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .actions button { border-radius:10px; font-size:14px; }
    .actions .primary:hover { background:#1d4ed8; }
    .actions .ghost:hover:not(:disabled), .stepper button:hover { background:#f1f5fc; }
    .result { padding:28px; }
    .result-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
    .live-label { font-size:12px; color:#33745b; background:#edf7f1; border-radius:20px; padding:5px 10px; }
    .who { font-size:16px; margin-bottom:6px; }
    .start-line { font-size:13px; margin-bottom:20px; }
    .eyebrow { font-size:13px; }
    .date-main { font-size:clamp(42px,5vw,62px); letter-spacing:-.045em; color:#182b50; margin-top:10px; font-variant-numeric:tabular-nums; }
    .date-sub { font-size:13px; margin-top:12px; }
    .summary-grid { display:grid; grid-template-columns:1fr 1fr; margin-top:24px; padding:18px 0; border-top:1px solid var(--color-border); border-bottom:1px solid var(--color-border); }
    .summary-grid > div { padding-left:20px; }
    .summary-grid > div:first-child { padding-left:0; border-right:1px solid var(--color-border); }
    .summary-grid span { display:block; font-size:12px; color:var(--color-muted-foreground); }
    .summary-grid strong { display:block; font-size:17px; margin-top:5px; font-weight:650; }
    .renew { background:#fffbf1; border-color:#f3e5bf; border-left:3px solid #d6a246; border-radius:10px; padding:15px 18px; margin-top:22px; }
    .renew h2 { color:#865c19; font-size:12px; }
    .renew p { font-size:17px; color:#734c14; }
    .renew .detail { font-size:12px; line-height:1.7; color:#865c19; }
    .list-head { margin-top:26px; margin-bottom:14px; }
    .list-head h2 { font-size:16px; }
    .list-head p { font-size:12px; }
    ol { max-height:350px; scrollbar-width:thin; scrollbar-color:#cbd5e1 transparent; }
    li { min-height:70px; padding:12px 4px; border-color:#eef1f6; grid-template-columns:36px minmax(0,1fr) auto; gap:14px; }
    li .idx { border-radius:50%; width:32px; height:32px; font-size:12px; color:#66758e; }
    li .when { font-size:14px; font-weight:550; }
    li .meta { font-size:12px; margin-top:3px; }
    li .tag:not(:empty) { font-size:11px; padding:4px 9px; border-radius:6px; background:#f7f8fc; }
    li.is-renew .tag { background:#fff4d9; }
    li.is-end .tag { background:#eaf8f0; }
    .footnote { display:flex; justify-content:space-between; gap:12px; color:var(--color-muted-foreground); font-size:12px; margin:20px 2px 0; }
    .modal-card { border:1px solid var(--color-border); }
    body:has(.modal:not([hidden])) { overflow:hidden; }
    @media(min-width:801px) { .layout > section:first-child { position:sticky; top:24px; } }
    @media(max-width:800px) { .wrap { width:calc(100% - 32px); padding-top:24px; } .layout { grid-template-columns:1fr; gap:18px; margin-top:22px; } .header-top { flex-direction:row; align-items:center; flex-wrap:wrap; } .header-actions { width:auto; grid-template-columns:104px 80px; } header h1 { font-size:26px; } .days { grid-template-columns:repeat(7,minmax(0,1fr)); } form,.result { padding:22px; } .footnote { flex-direction:column; gap:5px; } }
    @media(max-width:380px) { .wrap { width:calc(100% - 24px); } form,.result { padding:18px; } .list-head { align-items:flex-start; } .list-head p { max-width:58%; text-align:right; } }

    /* Equal panels and unified selection controls */
    @media(min-width:801px) {
      .layout { align-items:stretch; }
      .layout > section:first-child { position:static; }
      .result { display:flex; flex-direction:column; min-height:0; }
      #schedule { flex:1 1 0; min-height:140px; max-height:none; overflow:auto; }
    }
    .control-native { display:none; }
    .control-wrap { position:relative; min-width:0; }
    .control-trigger { width:100%; min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; border:1px solid #dce2ec; background:#fff; border-radius:10px; color:var(--color-foreground); font:inherit; font-size:14px; text-align:left; cursor:pointer; transition:border-color .18s,box-shadow .18s; }
    .control-trigger:hover { border-color:#97afd4; }
    .control-trigger[aria-expanded="true"] { border-color:#2563eb; box-shadow:0 0 0 3px #2563eb15; }
    .control-trigger .control-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .control-mark { color:#63738c; font-size:13px; flex:none; }
    .control-popover { position:fixed; z-index:50; width:300px; max-width:calc(100vw - 24px); padding:8px; border:1px solid #e0e6ef; background:#fff; border-radius:14px; box-shadow:0 12px 36px #182b5024; overflow:auto; overscroll-behavior:contain; }
    .control-popover[hidden] { display:none; }
    .select-option { display:block; width:100%; min-height:44px; padding:10px 12px; text-align:left; border:0; background:#fff; color:#26344b; border-radius:8px; font:inherit; font-size:14px; cursor:pointer; }
    .select-option:hover,.select-option:focus-visible { background:#f1f5fc; }
    .select-option[aria-selected="true"] { background:#edf3ff; color:#1d4ed8; font-weight:650; }
    .calendar-header { display:flex; align-items:center; gap:6px; padding:4px 2px 12px; }
    .calendar-header select { width:auto; flex:1; min-height:36px; padding:0 6px; font-size:13px; }
    .calendar-nav { width:36px; height:36px; flex:none; border:1px solid #e3e8f0; border-radius:8px; background:#fff; cursor:pointer; font-size:19px; color:#475569; }
    .calendar-week,.calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; }
    .calendar-week span { text-align:center; font-size:12px; color:#63738c; padding:6px 0; }
    .calendar-day { min-height:38px; padding:0; border:1px solid transparent; background:#fff; border-radius:8px; font:inherit; font-size:13px; cursor:pointer; color:#26344b; }
    .calendar-day.outside { color:#8b95a5; }
    .calendar-day.today { border-color:#a9c2ef; }
    .calendar-day:hover { background:#edf3ff; }
    .calendar-day[aria-pressed="true"] { background:#2563eb; color:#fff; font-weight:700; }
    .calendar-footer { border-top:1px solid #edf0f5; margin-top:8px; padding-top:8px; display:flex; justify-content:space-between; align-items:center; }
    .calendar-footer span { font-size:11px; color:#63738c; padding-left:6px; }
    .calendar-footer button { min-height:38px; border:0; background:#edf3ff; color:#1d4ed8; border-radius:8px; padding:0 14px; cursor:pointer; font:inherit; font-size:13px; }
    @media(max-width:800px) { #schedule { max-height:350px; } }
    @media(prefers-reduced-motion:reduce) { .control-trigger { transition:none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">课时计划 / CLASS PLANNER</div>
      <div class="header-top">
        <h1>让每一节课，心中有数</h1>
        <div class="actions header-actions">
          <button type="button" class="primary" id="open-add">新增学员</button>
          <button type="button" class="ghost" id="delete-record" disabled>删除</button>
        </div>
      </div>
      <p>设置上课日和剩余课时，即时查看结课日期与续费安排。</p>
    </header>

    <div class="layout">
      <section class="card" aria-label="计算条件">
        <form id="calc">
          <h2 class="panel-title">排课设置<small>调整后自动计算，无需手动保存</small></h2>
          <label class="field">
            <span>选择学员</span>
            <select id="lookup"></select>
            <p class="hint">可直接试算，也可新增学员保存安排。</p>
          </label>

          <p class="status" id="save-status" aria-live="polite"></p>

          <label class="field">
            <span>开始日期</span>
            <input id="count-from" type="date" required>
            <p class="hint">从当天开始计算，若当天上课则计入课时。</p>
          </label>

          <fieldset>
            <legend>每周上课日</legend>
            <div class="days" id="days"></div>
            <p class="hint">每天都可以选这次扣几节。选「不上」表示这天没课。最后一天只扣还剩的节数。</p>
          </fieldset>

          <div class="field">
            <span id="remain-label">剩余课时</span>
            <div class="stepper">
              <button type="button" id="remain-dec" aria-label="减少一节">−</button>
              <input id="remain-value" type="number" inputmode="numeric" min="1" max="999" value="5" aria-labelledby="remain-label">
              <button type="button" id="remain-inc" aria-label="增加一节">+</button>
            </div>
            <p class="hint">可以直接输入，比如 120。加减按钮仍可微调。</p>
          </div>

          <label class="field">
            <span>续费提醒</span>
            <select id="remind">
              <option value="1">还剩 1 节时提醒</option>
              <option value="2" selected>还剩 2 节时提醒</option>
              <option value="3">还剩 3 节时提醒</option>
            </select>
          </label>

          <p class="error" id="error" hidden></p>
        </form>
      </section>

      <section class="card result" aria-live="polite">
        <div class="result-heading"><h2 class="panel-title">课程安排</h2><span class="live-label">自动更新</span></div>
        <p class="who" id="who" hidden></p>
        <p class="start-line" id="start-line"></p>
        <p class="eyebrow">结课日期</p>
        <p class="date-main" id="end-date">—</p>
        <p class="date-sub" id="end-sub"></p>

        <div class="summary-grid"><div><span>剩余课时</span><strong id="summary-remain">—</strong></div><div><span>每周安排</span><strong id="summary-days">—</strong></div></div>
        <div class="renew" id="renew-box">
          <h2>建议续费</h2>
          <p id="renew-date">—</p>
          <p class="detail" id="renew-detail"></p>
        </div>

        <div class="list-head">
          <h2>课表</h2>
          <p id="list-summary"></p>
        </div>
        <ol id="schedule"></ol>
      </section>
    </div>
    <footer class="footnote"><span>排课按固定周计划推算，节假日与请假需自行调整。</span><span>学员记录仅保存在当前浏览器</span></footer>
  </div>

  <div class="modal" id="add-dialog" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title">新增学员</h2>
      <form id="add-form">
        <label class="field">
          <span>名称</span>
          <input id="dialog-name" type="text" maxlength="20" placeholder="例如小明" autocomplete="off">
        </label>
        <label class="field">
          <span>年级</span>
          <select id="dialog-grade">
            <option value="">未选</option>
            <option>幼儿园小班</option>
            <option>幼儿园中班</option>
            <option>幼儿园大班</option>
            <option>一年级</option>
            <option>二年级</option>
            <option>三年级</option>
            <option>四年级</option>
            <option>五年级</option>
            <option>六年级</option>
            <option>初一</option>
            <option>初二</option>
            <option>初三</option>
            <option>高一</option>
            <option>高二</option>
            <option>高三</option>
          </select>
        </label>
        <label class="field">
          <span>开始日期</span>
          <input id="dialog-start" type="date" required>
        </label>
        <label class="field">
          <span>剩余课时</span>
          <input id="dialog-remain" type="text" inputmode="numeric" maxlength="3" placeholder="例如 120" autocomplete="off">
        </label>
        <p class="error" id="dialog-error" hidden></p>
        <div class="actions">
          <button type="button" class="ghost" id="dialog-cancel">取消</button>
          <button type="submit" class="primary" id="dialog-save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const WEEK = [
      { day: 1, label: "一" },
      { day: 2, label: "二" },
      { day: 3, label: "三" },
      { day: 4, label: "四" },
      { day: 5, label: "五" },
      { day: 6, label: "六" },
      { day: 0, label: "日" }
    ];
    const WEEK_NAME = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

    const STORAGE_KEY = "class-end-records";
    const dialog = document.getElementById("add-dialog");
    const dialogName = document.getElementById("dialog-name");
    const dialogGrade = document.getElementById("dialog-grade");
    const dialogStart = document.getElementById("dialog-start");
    const dialogRemain = document.getElementById("dialog-remain");
    const dialogError = document.getElementById("dialog-error");
    const openAddButton = document.getElementById("open-add");
    const lookupSelect = document.getElementById("lookup");
    const saveStatus = document.getElementById("save-status");
    const deleteButton = document.getElementById("delete-record");
    const countFromInput = document.getElementById("count-from");
    const daysBox = document.getElementById("days");
    const REMAIN_MAX = 999;
    const remainValue = document.getElementById("remain-value");
    const remindSelect = document.getElementById("remind");
    const errorEl = document.getElementById("error");

    const DAY_QUOTAS = [1, 2, 3, 4];
    const state = {
      days: new Set([1, 5]),
      quotas: { 1: 1, 5: 1 },
      remain: 5,
      active: null
    };

    let records = readRecords();

    function readRecords() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (!Array.isArray(raw)) return [];
        return raw.filter((item) => item && typeof item.name === "string" && item.name && /^\d{4}-\d{2}-\d{2}$/.test(item.start));
      } catch (err) {
        return [];
      }
    }

    function writeRecords() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      } catch (err) {}
    }

    function renderLookup(selected) {
      const current = selected === undefined ? lookupSelect.value : selected;
      lookupSelect.replaceChildren();
      const empty = document.createElement("option");
      empty.value = "";
      empty.textContent = records.length ? "选择名称" : "还没有保存的名称";
      lookupSelect.appendChild(empty);
      records.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.name;
        option.textContent = [item.name, item.grade, Number.isInteger(item.remain) ? item.remain + "节" : ""].filter(Boolean).join(" · ");
        lookupSelect.appendChild(option);
      });
      lookupSelect.value = records.some((item) => item.name === current) ? current : "";
      deleteButton.disabled = lookupSelect.value === "";
    }

    function setSaveStatus(message) {
      saveStatus.textContent = message;
    }

    function showDialogError(message) {
      dialogError.hidden = !message;
      dialogError.textContent = message || "";
    }

    function openDialog() {
      dialogName.value = "";
      dialogGrade.value = "";
      dialogStart.value = toISO(new Date());
      dialogRemain.value = "";
      showDialogError("");
      dialog.hidden = false;
      dialogName.focus();
    }

    function closeDialog() {
      dialog.hidden = true;
      openAddButton.focus();
    }

    function saveRecord() {
      const name = dialogName.value.trim();
      const start = dialogStart.value;
      if (!name) {
        showDialogError("先填写名称。");
        dialogName.focus();
        return;
      }
      if (!start) {
        showDialogError("先选择开始时间。");
        dialogStart.focus();
        return;
      }
      const remainRaw = dialogRemain.value.trim();
      const remain = Number(remainRaw);
      if (!/^\d+$/.test(remainRaw) || remain < 1 || remain > REMAIN_MAX) {
        showDialogError("剩余课时请填 1 到 999 的整数。");
        dialogRemain.focus();
        return;
      }
      const next = { name: name, grade: dialogGrade.value, start: start, days: [...state.days], quotas: quotaSnapshot(), remain: remain, remind: Number(remindSelect.value) };
      const index = records.findIndex((item) => item.name === name);
      if (index >= 0) records[index] = next;
      else records.push(next);
      records.sort((a, b) => a.name.localeCompare(b.name, "zh"));
      writeRecords();
      state.active = next;
      state.remain = remain;
      countFromInput.value = start;
      renderLookup(name);
      setSaveStatus(index >= 0 ? "已更新「" + name + "」。" : "已新增「" + name + "」。");
      closeDialog();
      render();
    }

    function deleteRecord() {
      const name = lookupSelect.value;
      if (!name) return;
      records = records.filter((item) => item.name !== name);
      if (state.active && state.active.name === name) state.active = null;
      writeRecords();
      renderLookup("");
      setSaveStatus("已删除「" + name + "」。");
      render();
    }

    function applyRecord() {
      const record = records.find((item) => item.name === lookupSelect.value);
      deleteButton.disabled = !record;
      state.active = record || null;
      if (record) {
        countFromInput.value = record.start;
        if (Array.isArray(record.days)) state.days = new Set(record.days.filter(day => Number.isInteger(day) && day >= 0 && day <= 6));
        state.quotas = {};
        if (record.quotas && typeof record.quotas === "object") {
          Object.entries(record.quotas).forEach(([key, value]) => {
            const day = Number(key);
            const count = Number(value);
            if (day >= 0 && day <= 6 && DAY_QUOTAS.includes(count)) state.quotas[day] = count;
          });
        }
        if (Number.isInteger(record.remain)) state.remain = Math.max(1, Math.min(REMAIN_MAX, record.remain));
        if ([1, 2, 3].includes(record.remind)) remindSelect.value = String(record.remind);
      }
      setSaveStatus("");
      render();
    }

    function pad(n) { return String(n).padStart(2, "0"); }

    function toISO(date) {
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
    }

    function parseISO(value) {
      const [y, m, d] = value.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(date, days) {
      const next = new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
      return next;
    }

    function formatMonthDay(date) {
      return (date.getMonth() + 1) + "月" + date.getDate() + "日";
    }

    function formatFull(date) {
      return date.getFullYear() + "年" + formatMonthDay(date);
    }

    function daySpan(from, to) {
      const ms = parseISO(toISO(to)) - parseISO(toISO(from));
      return Math.round(ms / 86400000);
    }

    function quotaFor(day) {
      const count = state.quotas[day];
      return DAY_QUOTAS.includes(count) ? count : 1;
    }

    function quotaSnapshot() {
      const snapshot = {};
      state.days.forEach((day) => { snapshot[day] = quotaFor(day); });
      return snapshot;
    }

    function classSessions(anchor) {
      const sessions = [];
      let left = state.remain;
      let cursor = new Date(anchor.getTime());
      let guard = 0;
      while (left > 0 && guard < 8000) {
        const day = cursor.getDay();
        if (state.days.has(day)) {
          const planned = quotaFor(day);
          const used = Math.min(planned, left);
          left -= used;
          sessions.push({ date: new Date(cursor.getTime()), planned: planned, used: used, leftAfter: left });
        }
        cursor = addDays(cursor, 1);
        guard += 1;
      }
      return sessions;
    }

    function selectedDayNames() {
      return WEEK.filter((item) => state.days.has(item.day)).map((item) => "周" + item.label + " " + quotaFor(item.day) + "节");
    }

    function renderDays() {
      if (!daysBox.children.length) {
        WEEK.forEach((item) => {
          const slot = document.createElement("div");
          slot.className = "day-slot";
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = item.label;
          button.setAttribute("aria-label", "周" + item.label);
          button.addEventListener("click", () => {
            if (state.days.has(item.day)) state.days.delete(item.day);
            else {
              state.days.add(item.day);
              if (!DAY_QUOTAS.includes(state.quotas[item.day])) state.quotas[item.day] = 1;
            }
            render();
          });
          const select = document.createElement("select");
          select.setAttribute("aria-label", "周" + item.label + "每次课时");
          const off = document.createElement("option");
          off.value = "0";
          off.textContent = "不上";
          select.appendChild(off);
          DAY_QUOTAS.forEach((count) => {
            const option = document.createElement("option");
            option.value = String(count);
            option.textContent = count + "节";
            select.appendChild(option);
          });
          select.addEventListener("change", () => {
            const count = Number(select.value);
            if (count === 0) state.days.delete(item.day);
            else {
              state.days.add(item.day);
              state.quotas[item.day] = count;
            }
            render();
          });
          slot.append(button, select);
          daysBox.appendChild(slot);
        });
      }
      WEEK.forEach((item, index) => {
        const slot = daysBox.children[index];
        const button = slot.querySelector("button");
        const select = slot.querySelector("select");
        const on = state.days.has(item.day);
        button.setAttribute("aria-pressed", on ? "true" : "false");
        select.hidden = false;
        select.disabled = false;
        if (document.activeElement !== select) select.value = on ? String(quotaFor(item.day)) : "0";
      });
    }

    function renderWho() {
      const active = state.active;
      const label = active ? [active.name, active.grade].filter(Boolean).join(" · ") : "";
      const who = document.getElementById("who");
      who.hidden = label.length === 0;
      who.textContent = label;
    }

    function render() {
      renderWho();
      if (document.activeElement !== remainValue) remainValue.value = String(state.remain);
      renderDays();
      document.getElementById("remain-dec").disabled = state.remain <= 1;
      document.getElementById("remain-inc").disabled = state.remain >= REMAIN_MAX;
      document.getElementById("summary-remain").textContent = state.remain + " 节";
      document.getElementById("summary-days").textContent = selectedDayNames().join("、") || "未选择";

      const anchorValue = countFromInput.value;
      const anchor = anchorValue ? parseISO(anchorValue) : new Date(NaN);
      const names = selectedDayNames();
      if (!anchorValue || Number.isNaN(anchor.getTime())) {
        showError("先选择从哪天开始。");
        return;
      }
      if (names.length === 0) {
        showError("先选至少一个上课日。");
        return;
      }
      errorEl.hidden = true;

      if (state.active) {
        Object.assign(state.active, { start: anchorValue, days: [...state.days], quotas: quotaSnapshot(), remain: state.remain, remind: Number(remindSelect.value) });
        writeRecords();
      }
      const sessions = classSessions(anchor);
      if (!sessions.length) {
        showError("这段时间内排不满剩余课时。");
        return;
      }
      const end = sessions[sessions.length - 1];
      const remindAt = Number(remindSelect.value);
      const renewNow = state.remain <= remindAt;
      const renewSession = renewNow ? null : sessions.find((item) => item.leftAfter <= remindAt);
      const daysLeft = daySpan(anchor, end.date);

      const startLine = document.getElementById("start-line");
      startLine.hidden = false;
      startLine.textContent = "从 " + formatFull(anchor) + " 起";
      document.getElementById("end-date").textContent = formatMonthDay(end.date);
      document.getElementById("end-sub").textContent =
        formatFull(end.date) + " · " + WEEK_NAME[end.date.getDay()] + " · 距所选日期 " + daysLeft + " 天";

      const renewBox = document.getElementById("renew-date");
      const renewDetail = document.getElementById("renew-detail");
      if (renewNow) {
        renewBox.textContent = "现在就办";
        renewDetail.textContent = "剩下的课已经不多于 " + remindAt + " 节，结课日是 " + formatFull(end.date) + "。";
      } else {
        renewBox.textContent = formatFull(renewSession.date) + " " + WEEK_NAME[renewSession.date.getDay()];
        renewDetail.textContent = "上完这一天还剩 " + renewSession.leftAfter + " 节。最晚不要拖过结课当天 " + formatMonthDay(end.date) + "。";
      }

      document.getElementById("list-summary").textContent =
        names.join("、") + " · 共 " + state.remain + " 节";

      const list = document.getElementById("schedule");
      list.replaceChildren();
      sessions.forEach((session, index) => {
        const isEnd = session.leftAfter === 0;
        const isRenew = Boolean(renewSession) && session.date.getTime() === renewSession.date.getTime() && !isEnd;
        const li = document.createElement("li");
        if (isEnd) li.classList.add("is-end");
        else if (isRenew) li.classList.add("is-renew");

        const idx = document.createElement("span");
        idx.className = "idx";
        idx.textContent = String(index + 1);

        const text = document.createElement("div");
        const when = document.createElement("div");
        when.className = "when";
        when.textContent = formatMonthDay(session.date) + " " + WEEK_NAME[session.date.getDay()];
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = session.used < session.planned
          ? "计划 " + session.planned + " 节，实扣 " + session.used + " 节"
          : (isEnd ? "扣 " + session.used + " 节" : "扣 " + session.used + " 节，还剩 " + session.leftAfter + " 节");
        text.append(when, meta);

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = isEnd ? "结课" : (isRenew ? "续费" : "");

        li.append(idx, text, tag);
        list.appendChild(li);
      });
    }

    function showError(message) {
      errorEl.hidden = false;
      errorEl.textContent = message;
      renderWho();
      const startLine = document.getElementById("start-line");
      startLine.hidden = true;
      startLine.textContent = "";
      document.getElementById("end-date").textContent = "—";
      document.getElementById("end-sub").textContent = "";
      document.getElementById("renew-date").textContent = "—";
      document.getElementById("renew-detail").textContent = "";
      document.getElementById("list-summary").textContent = "";
      document.getElementById("schedule").replaceChildren();
    }

    renderLookup("");
    countFromInput.value = toISO(new Date());

    // Preserve native values and change events while presenting consistent controls.
    const enhancedControls = [];
    let activePicker = null;
    function closePicker(restoreFocus = false) {
      if (!activePicker) return;
      const previous = activePicker;
      previous.panel.hidden = true;
      previous.trigger.setAttribute("aria-expanded", "false");
      activePicker = null;
      if (restoreFocus) previous.trigger.focus();
    }
    function positionPicker(control) {
      const rect = control.trigger.getBoundingClientRect();
      const panel = control.panel;
      panel.style.width = (control.input.type === "date" ? Math.max(300, rect.width) : rect.width) + "px";
      panel.style.maxHeight = Math.min(380, window.innerHeight - 24) + "px";
      const height = panel.getBoundingClientRect().height;
      const below = window.innerHeight - rect.bottom - 12;
      const top = below >= height || below >= rect.top ? rect.bottom + 7 : rect.top - height - 7;
      panel.style.left = Math.max(12, Math.min(rect.left, window.innerWidth - panel.getBoundingClientRect().width - 12)) + "px";
      panel.style.top = Math.max(12, Math.min(top, window.innerHeight - height - 12)) + "px";
    }
    function commitPicker(control, value) {
      control.input.value = value;
      control.input.dispatchEvent(new Event("change", { bubbles:true }));
      control.sync();
      closePicker(true);
    }
    function drawCalendar(control) {
      const panel = control.panel;
      panel.replaceChildren();
      const head = document.createElement("div"); head.className = "calendar-header";
      const previous = document.createElement("button"); previous.type = "button"; previous.className = "calendar-nav"; previous.textContent = "‹"; previous.setAttribute("aria-label", "上个月");
      const next = document.createElement("button"); next.type = "button"; next.className = "calendar-nav"; next.textContent = "›"; next.setAttribute("aria-label", "下个月");
      const year = document.createElement("select"); year.setAttribute("aria-label", "年份");
      const baseYear = new Date().getFullYear();
      for (let y = Math.min(baseYear - 20, control.year - 1); y <= Math.max(baseYear + 30, control.year + 1); y++) { const option = new Option(y + "年", y); year.add(option); }
      year.value = String(control.year);
      const month = document.createElement("select"); month.setAttribute("aria-label", "月份");
      for (let m = 0; m < 12; m++) month.add(new Option((m + 1) + "月", m));
      month.value = String(control.month);
      function moveMonth(delta) { const d = new Date(control.year, control.month + delta, 1); control.year=d.getFullYear(); control.month=d.getMonth(); drawCalendar(control); positionPicker(control); control.panel.querySelector(delta < 0 ? ".calendar-nav" : ".calendar-nav:last-child").focus(); }
      previous.onclick = () => moveMonth(-1); next.onclick = () => moveMonth(1);
      year.onchange = () => { control.year = Number(year.value); drawCalendar(control); control.panel.querySelector('select[aria-label="年份"]').focus(); };
      month.onchange = () => { control.month = Number(month.value); drawCalendar(control); control.panel.querySelector('select[aria-label="月份"]').focus(); };
      head.append(previous, year, month, next); panel.append(head);
      const week = document.createElement("div"); week.className="calendar-week";
      ["一","二","三","四","五","六","日"].forEach(text => { const span=document.createElement("span"); span.textContent=text; week.append(span); }); panel.append(week);
      const grid = document.createElement("div"); grid.className="calendar-grid";
      const first = new Date(control.year,control.month,1);
      const offset = (first.getDay()+6)%7;
      const today = toISO(new Date());
      for(let index=0;index<42;index++) {
        const date=new Date(control.year,control.month,1-offset+index), iso=toISO(date);
        const day=document.createElement("button"); day.type="button"; day.className="calendar-day";
        if(date.getMonth()!==control.month) day.classList.add("outside");
        if(iso===today) { day.classList.add("today"); day.setAttribute("aria-current","date"); }
        day.textContent=String(date.getDate()); day.dataset.date=iso;
        day.setAttribute("aria-label",formatFull(date)+" "+WEEK_NAME[date.getDay()]);
        day.setAttribute("aria-pressed",String(iso===control.input.value));
        day.onclick=()=>commitPicker(control,iso);
        day.onkeydown=event=>{
          const offsets={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7};
          if(!(event.key in offsets))return;
          event.preventDefault(); const target=addDays(date,offsets[event.key]);
          control.year=target.getFullYear();control.month=target.getMonth();drawCalendar(control);
          panel.querySelector('[data-date="'+toISO(target)+'"]').focus();
        };
        grid.append(day);
      }
      panel.append(grid);
      const footer=document.createElement("div"); footer.className="calendar-footer";
      const note=document.createElement("span");note.textContent="方向键切换日期";
      const todayButton=document.createElement("button");todayButton.type="button";todayButton.textContent="回到今天";todayButton.onclick=()=>commitPicker(control,today);
      footer.append(note,todayButton);panel.append(footer);
    }
    function enhanceControl(input) {
      const field=input.closest("label.field");
      if(field) { const replacement=document.createElement("div");replacement.className=field.className;while(field.firstChild)replacement.append(field.firstChild);field.replaceWith(replacement); }
      const wrap=document.createElement("div");wrap.className="control-wrap";input.before(wrap);wrap.append(input);
      input.classList.add("control-native");input.tabIndex=-1;
      const trigger=document.createElement("button");trigger.type="button";trigger.className="control-trigger";
      const text=document.createElement("span");text.className="control-text";
      const mark=document.createElement("span");mark.className="control-mark";mark.textContent=input.type==="date" ? "选择日期" : "⌄";mark.setAttribute("aria-hidden","true");trigger.append(text,mark);
      const panel=document.createElement("div");panel.className="control-popover";panel.hidden=true;panel.id=input.id+"-picker";
      const isDate=input.type==="date";panel.setAttribute("role",isDate ? "dialog" : "listbox");
      const label=input.closest(".field").querySelector("span");
      if(label) { label.id=input.id+"-label";trigger.setAttribute("aria-labelledby",label.id+" "+input.id+"-text");panel.setAttribute("aria-labelledby",label.id); }
      text.id=input.id+"-text";trigger.setAttribute("aria-haspopup",isDate ? "dialog" : "listbox");trigger.setAttribute("aria-expanded","false");trigger.setAttribute("aria-controls",panel.id);
      wrap.append(trigger,panel);
      const control={input,trigger,panel,sync(){text.textContent=isDate ? (input.value ? formatFull(parseISO(input.value)) : "请选择日期") : (input.selectedOptions[0]?.textContent || "请选择");}};
      enhancedControls.push(control);control.sync();input.addEventListener("change",control.sync);
      new MutationObserver(control.sync).observe(input,{childList:true,subtree:true,characterData:true});
      trigger.onclick=()=>{
        if(activePicker===control){closePicker();return;}closePicker();activePicker=control;
        if(isDate){const date=input.value?parseISO(input.value):new Date();control.year=date.getFullYear();control.month=date.getMonth();drawCalendar(control);}
        else {panel.replaceChildren();[...input.options].forEach(option=>{const button=document.createElement("button");button.type="button";button.className="select-option";button.setAttribute("role","option");button.setAttribute("aria-selected",String(option.value===input.value));button.disabled=option.disabled;button.textContent=option.textContent;button.onclick=()=>commitPicker(control,option.value);panel.append(button);});}
        panel.hidden=false;trigger.setAttribute("aria-expanded","true");positionPicker(control);
        (panel.querySelector('[aria-pressed="true"], [aria-selected="true"]') || panel.querySelector("button"))?.focus();
      };
      panel.addEventListener("keydown",event=>{
        if(event.key==="Escape"){event.preventDefault();event.stopPropagation();closePicker(true);}
        if(!isDate && ["ArrowDown","ArrowUp","Home","End"].includes(event.key)){
          event.preventDefault();const options=[...panel.querySelectorAll("button:not(:disabled)")];let index=options.indexOf(document.activeElement);
          index=event.key==="Home"?0:event.key==="End"?options.length-1:(index+(event.key==="ArrowDown"?1:-1)+options.length)%options.length;options[index]?.focus();
        }
      });
    }
    ["lookup","remind","dialog-grade","count-from","dialog-start"].forEach(id=>enhanceControl(document.getElementById(id)));
    document.addEventListener("pointerdown",event=>{if(activePicker&&!activePicker.panel.contains(event.target)&&!activePicker.trigger.contains(event.target))closePicker();});
    document.addEventListener("focusin",event=>{if(activePicker&&!activePicker.panel.contains(event.target)&&event.target!==activePicker.trigger)closePicker();});
    window.addEventListener("resize",()=>{if(activePicker)positionPicker(activePicker);});
    document.addEventListener("scroll",event=>{if(activePicker&&!activePicker.panel.contains(event.target))positionPicker(activePicker);},true);
    const originalOpenDialog=openDialog;
    openDialog=function(){closePicker();originalOpenDialog();enhancedControls.forEach(control=>control.sync());};
    const originalCloseDialog=closeDialog;
    closeDialog=function(){closePicker();originalCloseDialog();};
    const originalRender=render;
    render=function(){originalRender();enhancedControls.forEach(control=>control.sync());};

    openAddButton.addEventListener("click", openDialog);
    document.getElementById("add-form").addEventListener("submit", (event) => {
      event.preventDefault();
      saveRecord();
    });
    document.getElementById("dialog-cancel").addEventListener("click", closeDialog);
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) closeDialog();
    });
    document.addEventListener("keydown", (event) => {
      if (dialog.hidden) return;
      if (event.key === "Escape") closeDialog();
      if (event.key === "Tab") {
        const controls = [...dialog.querySelectorAll("input, select, button")].filter(el => !el.disabled && el.getClientRects().length);
        const first = controls[0], last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });
    lookupSelect.addEventListener("change", applyRecord);
    deleteButton.addEventListener("click", deleteRecord);
    countFromInput.addEventListener("change", render);
    remindSelect.addEventListener("change", render);
    function commitRemain() {
      const raw = remainValue.value.trim();
      const n = Number(raw);
      state.remain = /^\d+$/.test(raw) ? Math.max(1, Math.min(REMAIN_MAX, n)) : state.remain;
      remainValue.value = String(state.remain);
      render();
    }
    remainValue.addEventListener("input", () => {
      const raw = remainValue.value.trim();
      if (!/^\d+$/.test(raw)) return;
      const n = Number(raw);
      if (n < 1 || n > REMAIN_MAX || n === state.remain) return;
      state.remain = n;
      render();
    });
    remainValue.addEventListener("change", commitRemain);
    document.getElementById("remain-dec").addEventListener("click", () => {
      state.remain = Math.max(1, state.remain - 1);
      render();
    });
    document.getElementById("remain-inc").addEventListener("click", () => {
      state.remain = Math.min(REMAIN_MAX, state.remain + 1);
      render();
    });

    render();
  </script>
</body>
</html>
